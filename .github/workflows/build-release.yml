name: ScrcpyRecv build, test and signed releases
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        srt: ['false', 'true']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify publication script contracts
        shell: pwsh
        run: ./tools/test-publication.ps1
      - name: Install pinned Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: JVM tests, lint and debug build (no devices)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug -PsrtTrial=${{ matrix.srt }} -PnodeExecutable="$(command -v node)" --no-daemon --console plain
      - name: Compile unsigned optimized release (R8 and resource shrinking)
        run: |
          ./gradlew :app:assembleRelease -PsrtTrial=${{ matrix.srt }} -PrequireReleaseSigning=false -PnodeExecutable="$(command -v node)" --no-daemon --console plain
      - name: Retain JVM test XML for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScrcpyRecv-junit-srt-${{ matrix.srt }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
  update-ui:
    name: Remote update UI only (ephemeral API35 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/publication-output/update-ui-avd
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned SDK and isolated emulator
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name update-ui --package "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
      - name: Build unsigned-development app and UI test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PsrtTrial=false -PnodeExecutable="$(command -v node)" --no-daemon --console plain
      - name: Run only AppUpdateRemoteUiTest on disposable emulator
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          output=publication-output/update-ui
          mkdir -p "$output"
          : > "$output/instrumentation-result.txt"
          diagnostics() {
            status=$?
            trap - EXIT
            set +e
            printf '%s\n' "$status" > "$output/exit-status.txt"
            echo "Updater UI step exit status: $status"
            cat "$output/instrumentation-result.txt"
            cat "$output/boot-environment.txt"
            tail -n 100 "$output/emulator.log"
            if [[ -n "${emulator_pid:-}" ]]; then
              ps -p "$emulator_pid" -o pid,stat,args > "$output/emulator-process.txt" 2>&1
              cat "$output/emulator-process.txt"
            fi
            timeout 10 "$adb" devices -l > "$output/adb-devices.txt" 2>&1
            cat "$output/adb-devices.txt"
            timeout 10 "$adb" -s emulator-5554 shell 'echo sys.boot_completed=$(getprop sys.boot_completed); echo init.svc.bootanim=$(getprop init.svc.bootanim); echo ro.boot.qemu=$(getprop ro.boot.qemu)' > "$output/boot-status.txt" 2>&1
            cat "$output/boot-status.txt"
            timeout 10 "$adb" -s emulator-5554 logcat -d -v threadtime ScrcpyUpdateUiTest:V AppUpdateRemoteUiTest:V UpdateTestActivity:V TestRunner:V AndroidJUnitRunner:V AndroidRuntime:E ActivityTaskManager:I '*:S' > "$output/test-logcat.txt" 2>&1
            tail -n 200 "$output/test-logcat.txt"
            exit "$status"
          }
          trap diagnostics EXIT
          {
            printf 'ANDROID_HOME=%s\nANDROID_AVD_HOME=%s\nANDROID_SERIAL=%s\nHOME=%s\n' "$ANDROID_HOME" "$ANDROID_AVD_HOME" "$ANDROID_SERIAL" "$HOME"
            ls -l /dev/kvm
            "$ANDROID_HOME/emulator/emulator" -list-avds
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd
          } > "$output/boot-environment.txt" 2>&1
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then echo "::error::KVM is not accessible to the disposable emulator"; exit 1; fi
          "$ANDROID_HOME/emulator/emulator" -avd update-ui -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > "$output/emulator.log" 2>&1 &
          emulator_pid=$!
          timeout 180 "$adb" -s emulator-5554 wait-for-device
          booted=false
          for attempt in $(seq 1 90); do
            if [[ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then echo "::error::Disposable emulator did not boot"; exit 1; fi
          "$adb" -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
          "$adb" -s emulator-5554 install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 180 "$adb" -s emulator-5554 shell am instrument -w -r -e class dev.scrcpy.update.AppUpdateRemoteUiTest org.screencopy.receiver.test/androidx.test.runner.AndroidJUnitRunner > "$output/instrumentation-result.txt" 2>&1
          if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_STATUS_CODE: -[23]|INSTRUMENTATION_CODE: -[23]' "$output/instrumentation-result.txt"; then exit 1; fi
          grep -Eq 'OK \([1-9][0-9]* tests?\)' "$output/instrumentation-result.txt"
      - name: Stop disposable emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
      - name: Upload only disposable updater UI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScrcpyRecv-update-ui-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            publication-output/update-ui/instrumentation-result.txt
            publication-output/update-ui/emulator.log
            publication-output/update-ui/test-logcat.txt
            publication-output/update-ui/adb-devices.txt
            publication-output/update-ui/exit-status.txt
            publication-output/update-ui/boot-environment.txt
            publication-output/update-ui/boot-status.txt
            publication-output/update-ui/emulator-process.txt
  optimized-native-smoke:
    name: Optimized release runtime (disposable API35 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/publication-output/release-smoke-avd
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned tools and disposable emulator
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
      - name: Build optimized non-debuggable app and safe release test APK
        run: |
          chmod +x gradlew
          pwsh -NoProfile -File tools/verify-release-smoke-apks.ps1 -SelfTest
          ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest -PreleaseSmokeTest=true -PsrtTrial=true -PrequireReleaseSigning=false -PnodeExecutable="$(command -v node)" --no-daemon --console plain
      - name: Run only safe optimized-release tests
        run: bash tools/run-release-smoke.sh
      - name: Stop disposable release-smoke emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
      - name: Retain only release-smoke diagnostics and mappings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScrcpyRecv-release-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            publication-output/release-smoke/apk-policy.txt
            publication-output/release-smoke/instrumentation-result.txt
            publication-output/release-smoke/test-logcat.txt
            publication-output/release-smoke/emulator.log
            publication-output/release-smoke/exit-status.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/releaseAndroidTest/mapping.txt
  publish:
    needs: [checks, update-ui, optimized-native-smoke]
    if: github.repository == 'arisewanggithub/ScrcpyRecv' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && vars.ENABLE_MAIN_PRERELEASES == 'true'))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit binary distribution approval
        env:
          BINARY_RELEASE_APPROVED: ${{ vars.BINARY_RELEASE_APPROVED }}
        run: |
          if [[ "$BINARY_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::Binary publication is blocked. The user must review the original-code license/distribution choice and third-party corresponding-source/relink obligations, then manually set repository variable BINARY_RELEASE_APPROVED=true. Signing secrets alone are not approval."
            exit 1
          fi
      - name: Require manual signing configuration and assign version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then echo "::error::Missing manual signing secret: $value"; exit 1; fi
          done
          code=$((10000 + GITHUB_RUN_NUMBER))
          if ((code > 2147483647)); then echo "::error::Android versionCode exhausted"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Stable tags must be vMAJOR.MINOR.PATCH"; exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:12}"
            tag="main-$code-${GITHUB_SHA:0:12}"
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/publication.keystore"
          chmod 600 "$RUNNER_TEMP/publication.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/publication.keystore" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseVersionCode=$code" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseVersionName=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build signed SRT and custom TCP release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PsrtTrial=true -PrequireReleaseSigning=true -PreleaseSmokeTest=false -PnodeExecutable="$(command -v node)" --no-daemon --console plain
      - name: Retain exact signed-release R8 mapping (not a release asset)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScrcpyRecv-r8-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/mapping/release/mapping.txt
      - name: Verify APK and produce exact updater manifest
        shell: pwsh
        run: |
          ./tools/make-update-manifest.ps1 -Apk app/build/outputs/apk/release/app-release.apk -ApplicationId org.screencopy.receiver -VersionCode ([int]$env:ORG_GRADLE_PROJECT_releaseVersionCode) -VersionName $env:ORG_GRADLE_PROJECT_releaseVersionName -ApkAssetName ScrcpyRecv.apk -BuildTools "$env:ANDROID_HOME/build-tools/36.0.0"
      - name: Publish only verified APK and update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes "Signed SRT/custom TCP release. See README for signing continuity and source licenses."
            else
              gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Opt-in development prerelease; excluded from stable automatic updates." --prerelease --latest=false
            fi
          fi
          gh release upload "$RELEASE_TAG" publication-output/ScrcpyRecv.apk publication-output/update.json --clobber
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
      - name: Remove runner-only signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/publication.keystore"
